<div
  class="refresh-indicator"
  [class.refresh-indicator--stale]="isStale() || isDegraded()"
  [matTooltip]="tooltip()"
  matTooltipPosition="below"
>
  @if (isDegraded()) {
    <mat-icon class="refresh-indicator__warning" aria-hidden="true">wifi_off</mat-icon>
  } @else if (isStale()) {
    <mat-icon class="refresh-indicator__warning" aria-hidden="true">warning</mat-icon>
  }

  <span class="refresh-indicator__label">{{ relativeLabel() }}</span>

  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="buttonLabel()"
    [disabled]="disabled()"
    (click)="refresh()"
  >
    @if (refreshing()) {
      <mat-icon aria-hidden="true">hourglass_top</mat-icon>
    } @else if (cooldownSecondsRemaining() !== null) {
      <span class="refresh-indicator__cooldown">{{ cooldownSecondsRemaining() }}s</span>
    } @else {
      <mat-icon aria-hidden="true">refresh</mat-icon>
    }
  </button>
</div>
