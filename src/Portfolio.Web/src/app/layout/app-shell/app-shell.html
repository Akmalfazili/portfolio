<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="shell__sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
  >
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/stocks"
        routerLinkActive="shell__nav-link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="isHandset() && sidenav.close()"
      >
        <mat-icon matListItemIcon aria-hidden="true">show_chart</mat-icon>
        <span matListItemTitle>Stocks</span>
      </a>
      <a
        mat-list-item
        routerLink="/crypto"
        routerLinkActive="shell__nav-link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="isHandset() && sidenav.close()"
      >
        <mat-icon matListItemIcon aria-hidden="true">currency_bitcoin</mat-icon>
        <span matListItemTitle>Crypto</span>
      </a>
      <a
        mat-list-item
        routerLink="/transactions"
        routerLinkActive="shell__nav-link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="isHandset() && sidenav.close()"
      >
        <mat-icon matListItemIcon aria-hidden="true">receipt_long</mat-icon>
        <span matListItemTitle>Transactions</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell__toolbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Toggle navigation" (click)="sidenav.toggle()">
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }

      <span class="shell__title">Portfolio Tracker</span>
      <span class="shell__spacer"></span>
      <app-refresh-indicator />
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
