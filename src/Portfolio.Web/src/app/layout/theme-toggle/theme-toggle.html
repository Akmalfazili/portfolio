<button
  mat-icon-button
  type="button"
  [attr.aria-label]="buttonLabel()"
  [matTooltip]="current().label"
  matTooltipPosition="below"
  [matMenuTriggerFor]="menu"
>
  <mat-icon aria-hidden="true">{{ current().icon }}</mat-icon>
</button>

<mat-menu #menu="matMenu">
  @for (option of options; track option.value) {
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="option.value === preference()"
      (click)="choose(option.value)"
    >
      <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
      <span>{{ option.label }}</span>
      @if (option.value === preference()) {
        <mat-icon class="theme-toggle__check" aria-hidden="true">check</mat-icon>
      }
    </button>
  }
</mat-menu>
