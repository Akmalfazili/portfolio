@if (amount() !== null || percent() !== null) {
  <span
    class="gain-loss"
    [class.gain-loss--gain]="isGain()"
    [class.gain-loss--loss]="isLoss()"
  >
    <!--
      D18 — inline SVG rather than a <mat-icon> ligature. The accessible name is
      unchanged (role="img" + aria-label on the wrapper, the glyph itself hidden),
      but there is no longer any icon-name text inside the element for raw
      textContent extraction to pick up. `fill="currentColor"` keeps the arrow on
      the same gain/loss token as the number beside it, with no second colour rule.
    -->
    <span class="gain-loss__icon-wrap" role="img" [attr.aria-label]="iconLabel()">
      <svg class="gain-loss__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
        <path [attr.d]="iconPath()" />
      </svg>
    </span>
    <span class="gain-loss__value">
      @if (signedAmount(); as amount) {
        <span>{{ amount }}</span>
      }
      @if (signedAmount() && signedPercent()) {
        <span class="gain-loss__sep" aria-hidden="true">·</span>
      }
      @if (signedPercent(); as percentText) {
        <span>{{ percentText }}</span>
      }
    </span>
  </span>
}
