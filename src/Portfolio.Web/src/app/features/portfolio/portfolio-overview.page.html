<section class="overview">
  <h1 class="overview__title">{{ sectionLabel() }} overview</h1>

  @if (isLoading()) {
    <app-state-message variant="loading" title="Loading your holdings…" />
  } @else if (hasError()) {
    <app-state-message
      variant="error"
      title="Couldn't load your holdings"
      description="Check that the API is running, then try again."
      actionLabel="Retry"
      (action)="retry()"
    />
  } @else if (isEmpty()) {
    <app-state-message
      variant="empty"
      [title]="sectionLabel() === 'Crypto' ? 'No crypto holdings yet' : 'No stock holdings yet'"
      description="Record a buy transaction to see it appear here."
      actionLabel="Add a transaction"
      (action)="goToTransactions()"
    />
  } @else if (summary(); as s) {
    <div class="overview__tiles">
      <app-stat-tile label="Total cost basis" [value]="s.totalCostBasisUsd | money"></app-stat-tile>
      <app-stat-tile label="Total market value" [value]="s.totalMarketValueUsd | money"></app-stat-tile>
      <app-stat-tile label="Unrealized gain/loss" [value]="s.totalUnrealizedPnlUsd | money">
        <app-gain-loss [amountUsd]="s.totalUnrealizedPnlUsd" [percent]="s.totalUnrealizedPnlPercent" />
      </app-stat-tile>
      <app-stat-tile label="Realized gain/loss" [value]="s.totalRealizedPnlUsd | money">
        <app-gain-loss [amountUsd]="s.totalRealizedPnlUsd" />
      </app-stat-tile>
    </div>

    <section class="overview__panel">
      <header class="overview__panel-header">
        <h2 class="overview__panel-title">Allocation</h2>
        <mat-button-toggle-group
          [value]="allocationMode()"
          (change)="setAllocationMode($event.value)"
          aria-label="Allocation basis"
        >
          <mat-button-toggle value="market">Market value</mat-button-toggle>
          <mat-button-toggle value="cost">Cost basis</mat-button-toggle>
        </mat-button-toggle-group>
      </header>
      <app-allocation-pie-chart [slices]="allocationSlices()" [valueLabel]="allocationValueLabel()" />
    </section>

    @if (isStock()) {
      <section class="overview__panel">
        <h2 class="overview__panel-title">Annual return</h2>
        <app-annual-return-chart [years]="annualReturns()" />
      </section>
    }

    <section class="overview__panel">
      <h2 class="overview__panel-title">Holdings</h2>
      <app-holdings-table [holdings]="holdings()" [basePath]="basePath()" />
    </section>
  }
</section>
