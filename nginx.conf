# Copied to /etc/nginx/conf.d/default.conf — a server block only, included inside the base
# image's own http{} context (see Dockerfile.web). Not a full nginx.conf.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static asset falls through to index.html so
    # Angular's router handles deep links (e.g. a reload on /stocks/AAPL) instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — plain reverse proxy, no upgrade headers needed.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub — MUST forward the WebSocket upgrade handshake, or the connection silently
    # degrades to long-polling. It still works either way, which is exactly why this is easy to
    # get wrong without noticing: verify in devtools that the connection shows status 101, not
    # repeated XHR polling.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }
}
